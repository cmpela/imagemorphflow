name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and development dependencies
        run: python -m pip install '.[dev]'
      - name: Lint for syntax and undefined names
        run: ruff check .
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Reproducible synthetic example
        run: python examples/synthetic/run_demo.py --output demo-output
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify wheel installation outside source checkout
        run: python tests/smoke_wheel.py dist/*.whl
      - name: Save distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python-version }}
          path: dist/*
